<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live</title>
<style>
  :root {
    --bg: #17141f; --panel: #221d2e; --text: #f1ecf7; --muted: #a79fb8; --live: #ff5d73;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 1100px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .badge {
    font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 99px;
    background: var(--panel); color: var(--muted);
  }
  .badge.live { background: var(--live); color: #fff; }
  .stage {
    position: relative; aspect-ratio: 16 / 9; background: #000;
    border-radius: 10px; overflow: hidden;
  }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .offline {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    background: var(--panel); padding: 16px;
  }
  .offline[hidden] { display: none; }
  .offline h2 { margin: 0; font-size: 1.3rem; }
  .offline p { margin: 0; color: var(--muted); }
  footer { margin-top: 14px; color: var(--muted); font-size: .9rem; }
  button.unmute {
    position: absolute; left: 12px; bottom: 56px; z-index: 2;
    background: var(--text); color: var(--bg); border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.unmute[hidden] { display: none; }
  :focus-visible { outline: 3px solid var(--live); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <span id="badge" class="badge">Offline</span>
  </header>

  <div class="stage">
    <video id="video" controls playsinline muted autoplay></video>
    <button id="unmute" class="unmute" hidden>Unmute</button>
    <div id="offline" class="offline">
      <h2>Stream is offline</h2>
      <p>This page checks every few seconds and starts playing when the stream goes live.</p>
    </div>
  </div>

  <footer id="footer"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
  // ---- CONFIG: edit these two lines ----
  // Stream location comes from the link hash: /#HOST/PATH  (never committed to the repo)
  const STREAM_URL = "https://" + location.hash.slice(1) + "/index.m3u8";
  const TITLE = "My Live Stream";
  // --------------------------------------

  const RETRY_MS = 5000;
  const video = document.getElementById("video");
  const offline = document.getElementById("offline");
  const badge = document.getElementById("badge");
  const unmute = document.getElementById("unmute");
  document.getElementById("title").textContent = TITLE;
  document.title = TITLE;

  let hls = null, timer = null;

  function setLive(on) {
    offline.hidden = on;
    badge.textContent = on ? "Live" : "Offline";
    badge.classList.toggle("live", on);
    unmute.hidden = !(on && video.muted);
  }

  function scheduleRetry() {
    clearTimeout(timer);
    timer = setTimeout(start, RETRY_MS);
  }

  function start() {
    if (hls) { hls.destroy(); hls = null; }
    if (video.canPlayType("application/vnd.apple.mpegurl") && !window.Hls) {
      video.src = STREAM_URL;
      video.play().catch(() => {});
      video.onplaying = () => setLive(true);
      video.onerror = () => { setLive(false); scheduleRetry(); };
      return;
    }
    if (!Hls.isSupported()) {
      video.src = STREAM_URL; // Safari / iOS native HLS
      video.onplaying = () => setLive(true);
      video.onerror = () => { setLive(false); scheduleRetry(); };
      return;
    }
    hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
    hls.loadSource(STREAM_URL);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      setLive(true);
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) { setLive(false); scheduleRetry(); }
    });
  }

  video.addEventListener("volumechange", () => { unmute.hidden = !video.muted || offline.hidden === false; });
  unmute.addEventListener("click", () => { video.muted = false; unmute.hidden = true; });

  start();
</script>
</body>
</html>
