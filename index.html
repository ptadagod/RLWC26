<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1a2b;
    --surface: #152642;
    --line: #243a5c;
    --text: #eef3fa;
    --muted: #8fa3bf;
    --accent: #4db3ff;
    --live: #ff4d5e;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 17px/1.55 var(--body);
    height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
  }
  .bar {
    border-bottom: 1px solid var(--line);
    padding: 14px clamp(16px, 4vw, 40px);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { font: 700 1.5rem/1 var(--display); letter-spacing: .02em; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: .95rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status.live { color: #fff; background: var(--live); border-color: var(--live); }
  .status.live .dot { background: #fff; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  main {
    width: 100%; max-width: 1180px; margin: 0 auto; flex: 1;
    padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 40px);
  }
  .stage {
    position: relative; aspect-ratio: 16 / 9; background: #000;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  video { width: 100%; height: 100%; display: block; background: #000; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: 10px; padding: 24px; background: var(--surface);
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font: 700 clamp(1.6rem, 4vw, 2.6rem)/1.1 var(--display); letter-spacing: .01em; }
  .overlay p { margin: 0; color: var(--muted); max-width: 44ch; }
  .poster-bg { position: absolute; inset: 0; background: linear-gradient(105deg, #b3141f 0 50%, #0b3a8f 50% 100%); background-size: cover; background-position: center; }
  .poster-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(14,26,43,.5), rgba(14,26,43,.82)); }
  .poster-body { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .teams { display: flex; align-items: baseline; gap: .35em; font: 700 clamp(2.4rem, 9vw, 6rem)/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .teams .vs { font-size: .38em; color: var(--muted); text-transform: lowercase; }
  .countdown { display: flex; gap: clamp(14px, 4vw, 36px); }
  .countdown[hidden] { display: none; }
  .countdown div { text-align: center; min-width: 3ch; }
  .countdown b { display: block; font: 700 clamp(2rem, 7vw, 4rem)/1 var(--display); font-variant-numeric: tabular-nums; }
  .countdown span { font-size: .85rem; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .unmute {
    position: absolute; left: 14px; top: 14px; z-index: 2;
    background: var(--text); color: var(--bg); border: 0; border-radius: 4px;
    padding: 8px 14px; font: 600 .95rem var(--body); cursor: pointer;
  }
  .unmute[hidden] { display: none; }

  .info { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px 32px; justify-content: space-between; align-items: flex-end; }
  .info h1 { margin: 0; font: 700 clamp(2rem, 5vw, 3.2rem)/1.05 var(--display); letter-spacing: .01em; }
  .info p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
  .reload {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 8px 16px; font: 500 .95rem var(--body); cursor: pointer;
  }
  .reload:hover { border-color: var(--accent); }

  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
  .watch.nochat { grid-template-columns: 1fr; }
  .chat { position: relative; min-height: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .chat[hidden] { display: none; }
  .chat-in { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .chat-head { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .chat-head span { color: var(--muted); }
  .chat-log { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: .95rem; overflow-wrap: anywhere; }
  .msg { padding: 2px 0; }
  .chat-join { padding: 14px; border-top: 1px solid var(--line); }
  .chat-join label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .9rem; }
  .chat .row, .chat-send { display: flex; gap: 8px; }
  .chat-send { padding: 10px; border-top: 1px solid var(--line); }
  .chat-join[hidden], .chat-send[hidden] { display: none; }
  .chat input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; font: inherit; }
  .chat button { background: var(--accent); color: #07203a; border: 0; border-radius: 4px; padding: 9px 14px; font: 600 .95rem var(--body); cursor: pointer; }
  .chat-err { margin: 8px 0 0; color: var(--live); font-size: .9rem; min-height: 1.2em; }
  @media (max-width: 900px) { .watch { grid-template-columns: 1fr; } .chat { height: 440px; min-height: 0; } }
  /* Twitch-style layout: video left, full-height chat right */
  .bar { height: 56px; padding-top: 0; padding-bottom: 0; }
  .layout { flex: 1; min-height: 0; display: flex; }
  .layout.nochat .chat { display: none; }
  main { flex: 1; min-width: 0; width: auto; max-width: none; margin: 0; padding: 0; overflow-y: auto; }
  .stage { border: 0; border-radius: 0; width: 100%; max-height: calc(100dvh - 56px); }
  .info { margin: 0; padding: 20px clamp(16px, 2vw, 28px) 0; }
  .squads { padding: 0 clamp(16px, 2vw, 28px); margin-bottom: 32px; }
  .chat { width: 340px; flex: none; min-height: 0; border: 0; border-left: 1px solid var(--line); border-radius: 0; }
  .chat-head { justify-content: center; text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; position: relative; }
  .chat-head span { position: absolute; right: 14px; text-transform: none; letter-spacing: 0; }
  .tabs { display: none; }
  @media (max-width: 900px) and (orientation: portrait) {
    body { height: var(--vvh, 100dvh); overflow: hidden; }
    .bar { height: 48px; }
    .layout { flex-direction: column; }
    main { display: contents; }
    .stage { flex: none; max-height: none; }
    .tabs { display: flex; flex: none; border-bottom: 1px solid var(--line); background: var(--bg); }
    .tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px; font: 600 .95rem var(--body); cursor: pointer; }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .chat { flex: 1; width: auto; height: auto; min-height: 0; border: 0; }
    .more { display: none; flex: 1; min-height: 0; overflow-y: auto; }
    .layout[data-tab="match"] .chat { display: none; }
    .layout[data-tab="match"] .more { display: block; }
    .layout.nochat .tabs { display: none; }
    .layout.nochat .more { display: block; }
    .chat-send { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    .typing .bar, .typing .tabs { display: none; }
  }
  .squads { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .squad { min-width: 0; }
  @media (max-width: 700px) {
    .squads { gap: 14px; }
    .squad h2 { font-size: 1.4rem; padding-left: 8px; border-left-width: 4px; }
    .squad li { gap: 6px; padding: 6px 0; }
    .squad .num { width: 1.4em; font-size: 1rem; }
    .avatar { width: 32px; height: 32px; font-size: .7rem; border-width: 1.5px; }
    .squad .name { font-size: .85rem; line-height: 1.2; overflow-wrap: anywhere; }
    .squad .pos { display: none; }
  }
  .squad h2 { margin: 0 0 4px; font: 700 2rem/1.1 var(--display); letter-spacing: .02em; padding-left: 12px; border-left: 5px solid var(--team); }
  .squad h3 { margin: 22px 0 6px; font: 600 .95rem var(--body); color: var(--muted); }
  .squad ul { list-style: none; margin: 0; padding: 0; }
  .squad li { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .squad .num { width: 1.8em; text-align: right; font: 700 1.2rem var(--display); color: var(--muted); }
  .avatar {
    width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden;
    background: var(--surface); border: 2px solid var(--team);
    display: flex; align-items: center; justify-content: center;
    font: 600 .85rem var(--body); color: var(--muted);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .squad .name { font-weight: 600; }
  .squad .pos { margin-left: auto; color: var(--muted); font-size: .9rem; }
  footer {
    border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem;
    padding: 16px clamp(16px, 4vw, 40px);
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .status.live .dot, .spinner { animation: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand" id="brand"></div>
  <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Offline</span></div>
</header>

<div class="layout" id="watch">
<main>
  <div class="stage">
    <video id="video" controls playsinline muted autoplay></video>
    <button id="unmute" class="unmute" hidden>Tap to unmute</button>
    <div id="overlay" class="overlay">
      <div id="posterBg" class="poster-bg"></div>
      <div class="poster-body">
        <div class="teams"><span id="teamA"></span><span class="vs">v</span><span id="teamB"></span></div>
        <div id="countdown" class="countdown" hidden>
          <div><b id="cdD">0</b><span>days</span></div>
          <div><b id="cdH">00</b><span>hours</span></div>
          <div><b id="cdM">00</b><span>mins</span></div>
          <div><b id="cdS">00</b><span>secs</span></div>
        </div>
        <div id="spinner" class="spinner" hidden></div>
        <h2 id="ovTitle" style="font-size:1.3rem">Stream starting soon</h2>
        <p id="ovText">Keep this page open. Playback begins automatically when the broadcast goes live.</p>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="chat" class="on">Chat</button>
    <button data-tab="match">Match</button>
  </div>

  <div class="more">
  <section class="info">
    <div>
      <h1 id="title"></h1>
      <p id="desc"></p>
    </div>
    <button id="reload" class="reload">Reload stream</button>
  </section>

  <section id="squads" class="squads" aria-label="Team lists"></section>
<footer id="footer"></footer>
  </div>
</main>

<aside id="chat" class="chat" aria-label="Live chat">
  <div class="chat-in">
    <div class="chat-head"><strong>Stream chat</strong><span id="chatCount"></span></div>
    <div id="chatLog" class="chat-log" aria-live="polite"></div>
    <div id="chatJoin" class="chat-join">
      <label for="nick">Pick a nickname to chat</label>
      <div class="row"><input id="nick" maxlength="20" autocomplete="off" placeholder="Nickname"><button id="joinBtn">Join</button></div>
      <p id="chatErr" class="chat-err"></p>
    </div>
    <div id="chatSend" class="chat-send" hidden>
      <input id="chatInput" maxlength="300" autocomplete="off" placeholder="Say something…"><button id="sendBtn">Send</button>
    </div>
  </div>
</aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
  // ---- EDIT THESE ----
  const BRAND = "RLWC26";
  const TEAM_A = "Tonga";
  const TEAM_B = "Samoa";
  const TITLE = "Tonga v Samoa";
  const DESCRIPTION = "Live stream of the match.";
  // Kickoff time with timezone offset. NZ daylight time is +13:00, NZ standard is +12:00.
  // Example: "2026-11-01T18:00:00+13:00". Leave "" to hide the countdown.
  const KICKOFF = "2026-11-01T22:05:00+13:00";
  // Optional poster image: upload a file (e.g. poster.jpg) to the repo and put its name here.
  const POSTER_URL = "";
  const FOOTER = "Private broadcast. Please don’t share this link.";
  // --------------------

  // Stream location comes from the link hash: /#HOST/PATH
  // Full link format: /#STREAMHOST/PATH~CHATHOST
  const HASH = location.hash.slice(1).split("~")[0];
  const STREAM_URL = "https://" + HASH + "/index.m3u8";
  const RETRY_MS = 5000;

  const $ = (id) => document.getElementById(id);
  const video = $("video"), overlay = $("overlay"), statusEl = $("status");
  $("brand").textContent = BRAND;
  $("title").textContent = TITLE;
  $("desc").textContent = DESCRIPTION;
  $("footer").textContent = FOOTER;
  document.title = TITLE;
  $("teamA").textContent = TEAM_A;
  $("teamB").textContent = TEAM_B;
  if (POSTER_URL) $("posterBg").style.backgroundImage = "url('" + POSTER_URL + "')";

  const KICK = KICKOFF ? new Date(KICKOFF).getTime() : NaN;
  let hls = null, timer = null, current = "offline";

  function tick() {
    const cd = $("countdown");
    if (current !== "offline") { cd.hidden = true; return; }
    const ms = KICK - Date.now();
    if (isNaN(ms)) { cd.hidden = true; return; }
    if (ms <= 0) {
      cd.hidden = true;
      $("ovTitle").textContent = "Kickoff any moment now";
      $("ovText").textContent = "Keep this page open. Playback begins automatically.";
      return;
    }
    const s = Math.floor(ms / 1000);
    $("cdD").textContent = Math.floor(s / 86400);
    $("cdH").textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, "0");
    $("cdM").textContent = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
    $("cdS").textContent = String(s % 60).padStart(2, "0");
    cd.hidden = false;
    $("ovTitle").textContent = "Kickoff in";
    $("ovText").textContent = new Date(KICK).toLocaleString([], {
      weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit", timeZoneName: "short"
    });
  }
  setInterval(tick, 1000);

  function setState(state) {
    const live = state === "live";
    current = state;
    statusEl.classList.toggle("live", live);
    $("statusText").textContent = live ? "Live" : "Offline";
    overlay.hidden = live;
    $("spinner").hidden = state !== "connecting";
    $("unmute").hidden = !(live && video.muted);
    if (state === "offline") {
      $("ovTitle").textContent = "Stream starting soon";
      $("ovText").textContent = "Keep this page open. Playback begins automatically when the broadcast goes live.";
      tick();
    } else if (state === "connecting") {
      $("ovTitle").textContent = "Connecting";
      $("ovText").textContent = "Loading the stream…";
    } else if (state === "invalid") {
      $("ovTitle").textContent = "Link incomplete";
      $("ovText").textContent = "This page needs the full viewing link. Ask the host to resend it.";
    }
  }

  function retrySoon() {
    clearTimeout(timer);
    timer = setTimeout(start, RETRY_MS);
  }

  function start() {
    clearTimeout(timer);
    if (!HASH || HASH.indexOf("/") < 1) { setState("invalid"); return; }
    if (hls) { hls.destroy(); hls = null; }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); setState("live"); });
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { setState("offline"); retrySoon(); } });
    } else {
      // Safari / iOS native HLS
      video.src = STREAM_URL;
      video.onplaying = () => setState("live");
      video.onerror = () => { setState("offline"); retrySoon(); };
      video.play().catch(() => {});
    }
  }

  video.addEventListener("volumechange", () => { $("unmute").hidden = !(video.muted && overlay.hidden); });
  $("unmute").addEventListener("click", () => { video.muted = false; $("unmute").hidden = true; });
  $("reload").addEventListener("click", start);
  window.addEventListener("hashchange", () => location.reload());

  // ---- TEAM LISTS (jersey 1 to 22, in order) ----
  const POSITIONS = ["Fullback","Wing","Centre","Centre","Wing","Five-eighth","Halfback","Prop","Hooker","Prop","Second row","Second row","Lock"];
  const SQUADS = [
    { name: TEAM_A, color: "#e0414f", players: [
      "Lehi Hopoate","Dallin Watene-Zelezniak","Tolutau Koula","Robert Toia","Jojo Fifita","Tuimoala Lolohea","Isaiya Katoa",
      "Addin Fonua-Blake","Salesi Foketi","Jason Taumalolo","Haumole Olakau'atu","Siua Wong","Tyson Frizell",
      "Soni Luke","Stefano Utoikamanu","Demitric Vaimauga","Taniela Paseka","Leka Halasima","Latu Fainu",
      "Paul Alamoti","Kulikefu Finefeuiaki","Sione Katoa" ] },
    { name: TEAM_B, color: "#4d8fe8", players: [
      "Hamiso Tabuai-Fidow","Brian To'o","Izack Tago","Stephen Crichton","Sualauvi Fa'alogo","Chanel Harris-Tavita","Jarome Luai",
      "Francis Molo","Benaiah Ioelu","Junior Paulo","Connelly Lemuelu","Jermaine McEwen","Francis Manuleleua",
      "Jazz Tevaga","Spencer Leniu","Shawn Blore","Ata Mariota","Clayton Faulalo","Ronald Volkman",
      "Pasami Saulo","Enari Tuala","Deine Mariner" ] }
  ];

  // Photos: put files in a "players" folder in the repo named like "jason-taumalolo.jpg".
  // Any player without a photo shows initials.
  function slug(n) { return n.toLowerCase().replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

  function renderSquads() {
    const root = $("squads");
    SQUADS.forEach((t) => {
      const col = document.createElement("div");
      col.className = "squad";
      col.style.setProperty("--team", t.color);
      const h2 = document.createElement("h2");
      h2.textContent = t.name;
      col.appendChild(h2);
      [["Starting 13", 0, 13], ["Interchange", 13, 19], ["Reserves", 19, 22]].forEach(([label, a, b]) => {
        const h3 = document.createElement("h3");
        h3.textContent = label;
        const ul = document.createElement("ul");
        for (let i = a; i < b; i++) {
          const name = t.players[i], parts = name.split(" ");
          const li = document.createElement("li");
          const num = document.createElement("span"); num.className = "num"; num.textContent = i + 1;
          const av = document.createElement("div"); av.className = "avatar"; av.textContent = parts[0][0] + parts[parts.length - 1][0];
          const img = new Image(); img.alt = "";
          img.onload = () => { av.textContent = ""; av.appendChild(img); };
          const base = "players/" + slug(name) + ".", exts = ["png", "jpg"];
          let k = 0;
          img.onerror = () => { if (++k < exts.length) img.src = base + exts[k]; };
          img.src = base + exts[0];
          const nm = document.createElement("span"); nm.className = "name"; nm.textContent = name;
          li.append(num, av, nm);
          if (i < 13) { const p = document.createElement("span"); p.className = "pos"; p.textContent = POSITIONS[i]; li.appendChild(p); }
          ul.appendChild(li);
        }
        col.append(h3, ul);
      });
      root.appendChild(col);
    });
  }
  renderSquads();

  // ---- LIVE CHAT ----
  function initChat() {
    const host = location.hash.slice(1).split("~")[1];
    if (!host) { $("chat").hidden = true; $("watch").classList.add("nochat"); return; }
    const log = $("chatLog");
    let ws = null, nick = "", retry = 0, saved = "";
    try { saved = localStorage.getItem("nick") || ""; } catch (e) {}
    $("nick").value = saved;

    const colorOf = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return "hsl(" + h + " 70% 72%)"; };
    function add(m) {
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
      const d = document.createElement("div"); d.className = "msg";
      const n = document.createElement("b"); n.textContent = m.nick; n.style.color = colorOf(m.nick);
      d.append(n, document.createTextNode(" " + m.text));
      log.appendChild(d);
      while (log.children.length > 200) log.firstChild.remove();
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    function connect() {
      ws = new WebSocket("wss://" + host);
      ws.onopen = () => {
        retry = 0;
        const n = nick || saved;
        if (n) ws.send(JSON.stringify({ type: "join", nick: n }));
      };
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === "joined") {
          nick = m.nick;
          try { localStorage.setItem("nick", nick); } catch (x) {}
          $("chatJoin").hidden = true; $("chatSend").hidden = false;
          log.textContent = ""; m.history.forEach(add); log.scrollTop = log.scrollHeight;
        } else if (m.type === "msg") add(m);
        else if (m.type === "count") $("chatCount").textContent = m.n + " in chat";
        else if (m.type === "clear") log.textContent = "";
        else if (m.type === "error") $("chatErr").textContent = m.text;
      };
      ws.onclose = () => setTimeout(connect, Math.min(1000 * ++retry, 8000));
    }
    function join() {
      $("chatErr").textContent = "";
      const n = $("nick").value.trim();
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "join", nick: n }));
      else $("chatErr").textContent = "Chat is connecting, try again in a moment.";
    }
    function sendMsg() {
      const t = $("chatInput").value.trim();
      if (!t || !ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({ type: "msg", text: t }));
      $("chatInput").value = "";
    }
    $("joinBtn").addEventListener("click", join);
    $("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
    $("sendBtn").addEventListener("click", sendMsg);
    $("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
    connect();
  }
  initChat();

  // mobile tabs + on-screen keyboard handling
  $("watch").dataset.tab = "chat";
  $("tabs").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    $("watch").dataset.tab = t.dataset.tab;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b === t));
  });
  if (window.visualViewport) {
    const fit = () => {
      document.documentElement.style.setProperty("--vvh", visualViewport.height + "px");
      window.scrollTo(0, 0);
    };
    visualViewport.addEventListener("resize", fit);
    fit();
  }
  ["chatInput", "nick"].forEach((id) => {
    $(id).addEventListener("focus", () => document.body.classList.add("typing"));
    $(id).addEventListener("blur", () => document.body.classList.remove("typing"));
  });

  start();
</script>
</body>
</html>
