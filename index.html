<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1a2b;
    --surface: #152642;
    --line: #243a5c;
    --text: #eef3fa;
    --muted: #8fa3bf;
    --accent: #4db3ff;
    --live: #ff4d5e;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 17px/1.55 var(--body);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .bar {
    border-bottom: 1px solid var(--line);
    padding: 14px clamp(16px, 4vw, 40px);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { font: 700 1.5rem/1 var(--display); letter-spacing: .02em; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: .95rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status.live { color: #fff; background: var(--live); border-color: var(--live); }
  .status.live .dot { background: #fff; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  main {
    width: 100%; max-width: 1180px; margin: 0 auto; flex: 1;
    padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 40px);
  }
  .stage {
    position: relative; aspect-ratio: 16 / 9; background: #000;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  video { width: 100%; height: 100%; display: block; background: #000; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: 10px; padding: 24px; background: var(--surface);
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font: 700 clamp(1.6rem, 4vw, 2.6rem)/1.1 var(--display); letter-spacing: .01em; }
  .overlay p { margin: 0; color: var(--muted); max-width: 44ch; }
  .poster-bg { position: absolute; inset: 0; background: linear-gradient(105deg, #b3141f 0 50%, #0b3a8f 50% 100%); background-size: cover; background-position: center; }
  .poster-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(14,26,43,.5), rgba(14,26,43,.82)); }
  .poster-body { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .teams { display: flex; align-items: baseline; gap: .35em; font: 700 clamp(2.4rem, 9vw, 6rem)/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .teams .vs { font-size: .38em; color: var(--muted); text-transform: lowercase; }
  .countdown { display: flex; gap: clamp(14px, 4vw, 36px); }
  .countdown[hidden] { display: none; }
  .countdown div { text-align: center; min-width: 3ch; }
  .countdown b { display: block; font: 700 clamp(2rem, 7vw, 4rem)/1 var(--display); font-variant-numeric: tabular-nums; }
  .countdown span { font-size: .85rem; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .unmute {
    position: absolute; left: 14px; top: 14px; z-index: 2;
    background: var(--text); color: var(--bg); border: 0; border-radius: 4px;
    padding: 8px 14px; font: 600 .95rem var(--body); cursor: pointer;
  }
  .unmute[hidden] { display: none; }

  .info { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px 32px; justify-content: space-between; align-items: flex-end; }
  .info h1 { margin: 0; font: 700 clamp(2rem, 5vw, 3.2rem)/1.05 var(--display); letter-spacing: .01em; }
  .info p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
  .reload {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 8px 16px; font: 500 .95rem var(--body); cursor: pointer;
  }
  .reload:hover { border-color: var(--accent); }

  footer {
    border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem;
    padding: 16px clamp(16px, 4vw, 40px);
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .status.live .dot, .spinner { animation: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand" id="brand"></div>
  <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Offline</span></div>
</header>

<main>
  <div class="stage">
    <video id="video" controls playsinline muted autoplay></video>
    <button id="unmute" class="unmute" hidden>Tap to unmute</button>
    <div id="overlay" class="overlay">
      <div id="posterBg" class="poster-bg"></div>
      <div class="poster-body">
        <div class="teams"><span id="teamA"></span><span class="vs">v</span><span id="teamB"></span></div>
        <div id="countdown" class="countdown" hidden>
          <div><b id="cdD">0</b><span>days</span></div>
          <div><b id="cdH">00</b><span>hours</span></div>
          <div><b id="cdM">00</b><span>mins</span></div>
          <div><b id="cdS">00</b><span>secs</span></div>
        </div>
        <div id="spinner" class="spinner" hidden></div>
        <h2 id="ovTitle" style="font-size:1.3rem">Stream starting soon</h2>
        <p id="ovText">Keep this page open. Playback begins automatically when the broadcast goes live.</p>
      </div>
    </div>
  </div>

  <section class="info">
    <div>
      <h1 id="title"></h1>
      <p id="desc"></p>
    </div>
    <button id="reload" class="reload">Reload stream</button>
  </section>
</main>

<footer id="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
  // ---- EDIT THESE ----
  const BRAND = "RLWC26";
  const TEAM_A = "Tonga";
  const TEAM_B = "Samoa";
  const TITLE = "Tonga v Samoa";
  const DESCRIPTION = "Live stream of the match.";
  // Kickoff time with timezone offset. NZ daylight time is +13:00, NZ standard is +12:00.
  // Example: "2026-11-01T18:00:00+13:00". Leave "" to hide the countdown.
  const KICKOFF = "2026-11-01T22:05:00+13:00";
  // Optional poster image: upload a file (e.g. poster.jpg) to the repo and put its name here.
  const POSTER_URL = "";
  const FOOTER = "Private broadcast. Please don’t share this link.";
  // --------------------

  // Stream location comes from the link hash: /#HOST/PATH
  const HASH = location.hash.slice(1);
  const STREAM_URL = "https://" + HASH + "/index.m3u8";
  const RETRY_MS = 5000;

  const $ = (id) => document.getElementById(id);
  const video = $("video"), overlay = $("overlay"), statusEl = $("status");
  $("brand").textContent = BRAND;
  $("title").textContent = TITLE;
  $("desc").textContent = DESCRIPTION;
  $("footer").textContent = FOOTER;
  document.title = TITLE;
  $("teamA").textContent = TEAM_A;
  $("teamB").textContent = TEAM_B;
  if (POSTER_URL) $("posterBg").style.backgroundImage = "url('" + POSTER_URL + "')";

  const KICK = KICKOFF ? new Date(KICKOFF).getTime() : NaN;
  let hls = null, timer = null, current = "offline";

  function tick() {
    const cd = $("countdown");
    if (current !== "offline") { cd.hidden = true; return; }
    const ms = KICK - Date.now();
    if (isNaN(ms)) { cd.hidden = true; return; }
    if (ms <= 0) {
      cd.hidden = true;
      $("ovTitle").textContent = "Kickoff any moment now";
      $("ovText").textContent = "Keep this page open. Playback begins automatically.";
      return;
    }
    const s = Math.floor(ms / 1000);
    $("cdD").textContent = Math.floor(s / 86400);
    $("cdH").textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, "0");
    $("cdM").textContent = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
    $("cdS").textContent = String(s % 60).padStart(2, "0");
    cd.hidden = false;
    $("ovTitle").textContent = "Kickoff in";
    $("ovText").textContent = new Date(KICK).toLocaleString([], {
      weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit", timeZoneName: "short"
    });
  }
  setInterval(tick, 1000);

  function setState(state) {
    const live = state === "live";
    current = state;
    statusEl.classList.toggle("live", live);
    $("statusText").textContent = live ? "Live" : "Offline";
    overlay.hidden = live;
    $("spinner").hidden = state !== "connecting";
    $("unmute").hidden = !(live && video.muted);
    if (state === "offline") {
      $("ovTitle").textContent = "Stream starting soon";
      $("ovText").textContent = "Keep this page open. Playback begins automatically when the broadcast goes live.";
      tick();
    } else if (state === "connecting") {
      $("ovTitle").textContent = "Connecting";
      $("ovText").textContent = "Loading the stream…";
    } else if (state === "invalid") {
      $("ovTitle").textContent = "Link incomplete";
      $("ovText").textContent = "This page needs the full viewing link. Ask the host to resend it.";
    }
  }

  function retrySoon() {
    clearTimeout(timer);
    timer = setTimeout(start, RETRY_MS);
  }

  function start() {
    clearTimeout(timer);
    if (!HASH || HASH.indexOf("/") < 1) { setState("invalid"); return; }
    if (hls) { hls.destroy(); hls = null; }
    setState("connecting");

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); setState("live"); });
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { setState("offline"); retrySoon(); } });
    } else {
      // Safari / iOS native HLS
      video.src = STREAM_URL;
      video.onplaying = () => setState("live");
      video.onerror = () => { setState("offline"); retrySoon(); };
      video.play().catch(() => {});
    }
  }

  video.addEventListener("volumechange", () => { $("unmute").hidden = !(video.muted && overlay.hidden); });
  $("unmute").addEventListener("click", () => { video.muted = false; $("unmute").hidden = true; });
  $("reload").addEventListener("click", start);
  window.addEventListener("hashchange", () => location.reload());

  start();
</script>
</body>
</html>
